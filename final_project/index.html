<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biases Generator</title>
  <style>
    :root {
      --bg: #f6efe5;
      --panel: rgba(255, 251, 247, 0.9);
      --text: #1d1a16;
      --muted: #6c5c4c;
      --accent: #b8522f;
      --accent-dark: #8e3e21;
      --border: rgba(29, 26, 22, 0.12);
      --shadow: 0 24px 70px rgba(85, 55, 36, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(255, 214, 163, 0.65), transparent 32%),
        linear-gradient(135deg, #efe2d0, #f7f2eb 58%, #ead7c2);
      padding: 24px;
    }

    .app {
      width: min(1080px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 24px;
      grid-template-columns: minmax(320px, 420px) minmax(0, 1fr);
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .composer {
      padding: 32px;
    }

    .eyebrow {
      margin: 0 0 12px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-size: 0.76rem;
      color: var(--accent);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2.2rem, 5vw, 4rem);
      line-height: 0.95;
    }

    p {
      color: var(--muted);
      line-height: 1.5;
    }

    form {
      margin-top: 24px;
      display: grid;
      gap: 16px;
    }

    textarea,
    select,
    input[type="text"] {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px 18px;
      font: inherit;
      font-size: 1rem;
      background: rgba(255, 255, 255, 0.72);
      color: var(--text);
    }

    textarea {
      min-height: 200px;
      resize: vertical;
    }

    button {
      width: fit-content;
      border: 0;
      border-radius: 999px;
      padding: 14px 22px;
      font: inherit;
      font-weight: 700;
      color: white;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      cursor: pointer;
      transition: transform 120ms ease, opacity 120ms ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .status {
      min-height: 24px;
      margin: 0;
      font-size: 0.95rem;
      color: var(--muted);
    }

    .saved-files {
      margin: 0;
      padding: 16px 18px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.56);
      white-space: pre-wrap;
      color: var(--text);
      line-height: 1.5;
      font-size: 0.95rem;
    }

    .preview {
      padding: 18px;
      display: grid;
      place-items: center;
      min-height: 640px;
      position: relative;
      overflow: hidden;
    }

    .preview::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(160deg, rgba(184, 82, 47, 0.08), transparent 42%),
        radial-gradient(circle at 80% 20%, rgba(255, 214, 163, 0.44), transparent 22%);
      pointer-events: none;
    }

    .placeholder,
    .preview img {
      position: relative;
      z-index: 1;
    }

    .placeholder {
      max-width: 360px;
      text-align: center;
      color: var(--muted);
      line-height: 1.6;
    }

    .preview img {
      display: none;
      width: 100%;
      height: auto;
      border-radius: 18px;
      box-shadow: 0 22px 60px rgba(29, 26, 22, 0.18);
    }

    @media (max-width: 900px) {
      .app {
        grid-template-columns: 1fr;
      }

      .preview {
        min-height: 420px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="panel composer">
      <p class="eyebrow">biased or what??</p>
      <h1>BIASES GENERATOR</h1>
      <p>
        Choose a provider, set a batch name, and generate one image at a time.
        Each click adds a new image file into the same batch folder so you can compare variations.
      </p>

      <form id="prompt-form">
        <label for="provider">API Provider</label>
        <select id="provider" name="provider">
          <option value="openai">OpenAI</option>
          <option value="xai">xAI</option>
        </select>

        <label for="batch-name">Batch Name</label>
        <input id="batch-name" name="batch-name" type="text" required>

        <label for="prompt">Prompt</label>
        <textarea id="prompt" name="prompt" required></textarea>

        <button id="submit-button" type="submit">Generate 1 Image</button>
        <p id="status" class="status"></p>
        <div id="saved-files" class="saved-files">The saved file path will appear here after generation.</div>
      </form>
    </section>

    <section class="panel preview">
      <p id="placeholder" class="placeholder">
        The latest generated image will appear here.
      </p>
      <img id="result-image" alt="Generated image">
    </section>
  </main>

  <script>
    const form = document.getElementById("prompt-form");
    const providerField = document.getElementById("provider");
    const batchNameField = document.getElementById("batch-name");
    const promptField = document.getElementById("prompt");
    const submitButton = document.getElementById("submit-button");
    const statusField = document.getElementById("status");
    const savedFilesField = document.getElementById("saved-files");
    const resultImage = document.getElementById("result-image");
    const placeholder = document.getElementById("placeholder");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const prompt = promptField.value.trim();
      const batchName = batchNameField.value.trim();
      if (!prompt) {
        statusField.textContent = "Please enter a prompt first.";
        return;
      }
      if (!batchName) {
        statusField.textContent = "Please enter a batch name first.";
        return;
      }

      submitButton.disabled = true;
      statusField.textContent = "Generating image...";
      savedFilesField.textContent = "Saving file...";

      try {
        const response = await fetch("/generate", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            provider: providerField.value,
            batchName,
            prompt
          })
        });

        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload.error || "Something went wrong.");
        }

        resultImage.src = payload.imageUrl;
        resultImage.style.display = "block";
        if (placeholder) {
          placeholder.style.display = "none";
        }
        savedFilesField.textContent = payload.savedFile || "No file was saved.";
        statusField.textContent = "Image generated successfully.";
      } catch (error) {
        statusField.textContent = error.message;
        savedFilesField.textContent = "No file was saved.";
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
